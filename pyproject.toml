[project]
name = "pr-guardian"
# one source of truth: src/pr_guardian/version.py
dynamic = ["version"]
description = "Evidence-based AI code review agent for Python diffs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "ruff>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1.6",  # 3.1.0-3.1.5 carry GHSA-cpwx-vrp4-4pq7 / PYSEC-2026-1471
    "python-multipart>=0.0.9",
    # Needed at runtime: the demo runs the trusted suite to produce evidence.
    "pytest>=9.1.1",  # earlier 8.x/9.0 lines carry GHSA-6w46-j5rx-g56g
    "pytest-json-report>=1.5",
    # MCP server/client; pinned to the v2 SDK line that renamed FastMCP to MCPServer
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.45",
    # test-only: proves MCP sessions leave no server child process behind
    "psutil>=5.9",
]

[project.scripts]
pr-guardian = "pr_guardian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pr_guardian/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
