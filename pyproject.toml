[project]
name = "pr-guardian"
version = "0.1.0"
description = "Evidence-based AI code review agent for Python diffs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "ruff>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Needed at runtime: the demo runs the trusted suite to produce evidence.
    "pytest>=8",
    "pytest-json-report>=1.5",
    # MCP server/client; pinned to the v2 SDK line that renamed FastMCP to MCPServer
    "mcp==2.3.0",
]

[project.optional-dependencies]
dense = [
    # optional local embedding stack; never installed for the web app or Render
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
]
dev = [
    # numeric only: lets CI run the fusion/dense-cache logic with a fake embedder
    # without pulling onnxruntime or the model
    "numpy>=1.26",
    "playwright>=1.45",
    # test-only: proves MCP sessions leave no server child process behind
    "psutil>=5.9",
]

[project.scripts]
pr-guardian = "pr_guardian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
