[project]
name = "pr-guardian"
version = "0.1.0"
description = "Evidence-based AI code review agent for Python diffs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "ruff>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-json-report>=1.5", "playwright>=1.45"]

[project.scripts]
pr-guardian = "pr_guardian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
