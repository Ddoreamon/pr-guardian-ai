name: Launcher smoke (Linux)

# Actually runs start-local.sh on Linux. Steps are deliberately small so a failure
# names its own cause: the GitHub API log endpoint is not readable with this token,
# only step conclusions and the printed markers are.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launcher:
    name: start-local.sh on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install into a venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[dev]"

      - name: Syntax check
        run: bash -n start-local.sh && echo "syntax ok"

      - name: Launch with dependencies present
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          python -c "import fastapi, uvicorn, ruff; print('deps import ok')"
          python scripts/check_env.py
          chmod +x start-local.sh
          nohup ./start-local.sh 8899 > /tmp/launcher.log 2>&1 &
          echo $! > /tmp/launcher.pid
          echo "launcher pid: $(cat /tmp/launcher.pid)"
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:8899/health > /tmp/health.json 2>/dev/null; then
              echo "ready after ${i}s"
              break
            fi
            sleep 1
          done
          echo "--- health ---"
          cat /tmp/health.json
          echo "--- launcher log ---"
          cat /tmp/launcher.log
          test -s /tmp/health.json

      - name: Health contract
        run: |
          set -euo pipefail
          python -c 'import json; d=json.load(open("/tmp/health.json")); assert d["version"]=="1.1.0rc1", d; assert d["public_mode"] is False, d; assert d["llm_status"]=="not_configured", d; print("health contract ok")'

      - name: Uploads on, AI off
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8899/api/uploads/config > /tmp/uploads.json
          cat /tmp/uploads.json
          python -c 'import json; d=json.load(open("/tmp/uploads.json")); assert d["enabled"] is True, d; assert d["ai_enabled"] is False, d; print("uploads on, ai off")'

      - name: Loopback only
        run: |
          set -euo pipefail
          python scripts/check_loopback.py 8899

      - name: Shutdown and cleanup
        run: |
          set -euo pipefail
          PID=$(cat /tmp/launcher.pid)
          kill "$PID" 2>/dev/null || true
          for _ in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if curl -fsS --max-time 2 http://127.0.0.1:8899/health > /dev/null 2>&1; then
            echo "server still answering after shutdown"
            exit 1
          fi
          leftovers=$(find /tmp -maxdepth 1 -name 'pr-guardian-upload-*' | wc -l)
          echo "temp dirs left: $leftovers"
          test "$leftovers" -eq 0
          echo "shutdown ok"

      - name: Missing dependencies ask first and do not install on "n"
        run: |
          set -euo pipefail
          python -m venv /tmp/bare-venv
          set +e
          PATH="/tmp/bare-venv/bin:$PATH" bash -c 'printf "n\n" | ./start-local.sh 8901' > /tmp/bare.log 2>&1
          BARE_STATUS=$?
          set -e
          echo "--- bare log (exit $BARE_STATUS) ---"
          cat /tmp/bare.log
          test "$BARE_STATUS" -ne 0
          grep -q "Install the project dependencies now?" /tmp/bare.log
          grep -q "\[stopped\] Nothing was installed" /tmp/bare.log
          if /tmp/bare-venv/bin/python -c "import fastapi" 2>/dev/null; then
            echo "dependencies were installed without consent"
            exit 1
          fi
          echo "no silent install"

      - name: Install Python 3.11 for the version-gate check
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: check_env exits 2 on Python 3.11
        run: |
          set -euo pipefail
          echo "python: $(command -v python) -> $(python -V 2>&1)"
          set +e
          python scripts/check_env.py > /tmp/old.log 2>&1
          STATUS=$?
          set -e
          echo "--- check_env exit $STATUS ---"
          cat /tmp/old.log
          if [ "$STATUS" -ne 2 ]; then
            echo "::error::check_env exit was $STATUS, expected 2"
            exit 1
          fi
          grep -q "Python 3.12 or newer is required" /tmp/old.log || {
            echo "::error::missing version message"
            exit 1
          }

      - name: launcher refuses Python 3.11
        run: |
          set -euo pipefail
          mkdir -p /tmp/only311
          REAL=$(command -v python)
          ln -sf "$REAL" /tmp/only311/python3.12
          ln -sf "$REAL" /tmp/only311/python3
          ln -sf "$REAL" /tmp/only311/python
          ls -l /tmp/only311
          echo "shim resolves to: $(PATH=/tmp/only311:/usr/bin:/bin command -v python3.12)"
          set +e
          PATH="/tmp/only311:/usr/bin:/bin" timeout 20 bash -c './start-local.sh 8902' > /tmp/old-launcher.log 2>&1
          LAUNCH_STATUS=$?
          set -e
          echo "--- launcher exit $LAUNCH_STATUS ---"
          cat /tmp/old-launcher.log
          if [ "$LAUNCH_STATUS" -eq 0 ] || [ "$LAUNCH_STATUS" -eq 124 ]; then
            echo "::error::launcher exit $LAUNCH_STATUS (0 = started on old python, 124 = hung)"
            exit 1
          fi
          grep -q "Install Python 3.12 or newer" /tmp/old-launcher.log || {
            echo "::error::launcher did not explain the old interpreter"
            exit 1
          }
